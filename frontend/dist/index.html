<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123b36" />
    <link rel="icon" type="image/svg+xml" href="/dailyactivity-logo.svg" />
    <title>Storefront</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: #18332f;
        background: #f3f6f4;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      #app.startup-state {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        box-sizing: border-box;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(204, 226, 215, 0.62), transparent 56%),
          linear-gradient(145deg, #f7f9f7 0%, #edf3ef 100%);
      }

      .startup-card {
        width: min(100%, 430px);
        box-sizing: border-box;
        padding: 44px 42px 40px;
        border: 1px solid rgba(31, 76, 64, 0.11);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 70px rgba(27, 57, 47, 0.09), 0 3px 10px rgba(27, 57, 47, 0.04);
        text-align: center;
      }

      .startup-mark {
        display: grid;
        width: 52px;
        height: 52px;
        place-items: center;
        margin: 0 auto 24px;
        border: 1px solid #dce9e1;
        border-radius: 16px;
        background: #f2f7f3;
        color: #245a4e;
      }

      .startup-mark svg {
        width: 25px;
        height: 25px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .startup-card h1 {
        margin: 0;
        color: #18332f;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.025em;
      }

      .startup-card p {
        margin: 10px 0 25px;
        color: #71817a;
        font-size: 14px;
        line-height: 1.6;
      }

      .startup-progress {
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8efea;
      }

      .startup-progress::after {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #3d806e, #8ab8a3);
        content: "";
        animation: startup-progress 1.65s ease-in-out infinite;
      }

      .startup-error .startup-mark {
        border-color: #f0ddd5;
        background: #fff6f2;
        color: #a75b43;
      }

      .startup-error .startup-progress {
        display: none;
      }

      .startup-retry {
        min-height: 42px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: #183f37;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .startup-retry:hover {
        background: #245a4e;
      }

      .startup-retry:focus-visible {
        outline: 3px solid #a8cbbc;
        outline-offset: 3px;
      }

      @keyframes startup-progress {
        0% { transform: translateX(-115%); }
        100% { transform: translateX(280%); }
      }

      @media (max-width: 480px) {
        #app.startup-state { padding: 18px; }
        .startup-card { padding: 36px 25px 32px; border-radius: 16px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-progress::after { animation: none; width: 100%; opacity: 0.65; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BO0qMQ4n.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DG8kzdSk.css">
  </head>
  <body>
    <div id="app" class="startup-state" aria-busy="true">
      <section class="startup-card" role="status" aria-live="polite">
        <div class="startup-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 7.5h16M6.5 7.5v10h11v-10M9 11h6M9 14h4" /><path d="m8 4.5 4-2 4 2" /></svg>
        </div>
        <h1>Preparing your store</h1>
        <p>Loading store information and available products.</p>
        <div class="startup-progress" aria-hidden="true"></div>
      </section>
    </div>
  </body>
</html>
